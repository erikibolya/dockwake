# DockWake + Frigate behind Traefik.
#
# Replace example.com, the basic-auth hash, Traefik entrypoint/certresolver and
# the storage paths with your own values. Frigate keeps its normal config and
# recordings; DockWake only starts and stops its container.
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2-tensorrt
    container_name: frigate
    restart: unless-stopped
    runtime: nvidia
    shm_size: "2gb"
    stop_grace_period: 30s
    environment:
      - TZ=Europe/Prague
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - FRIGATE_RTSP_USER=${FRIGATE_RTSP_USER}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
    volumes:
      - /mnt/user/appdata/frigate/config:/config
      - /mnt/user/ProgramDataHDD/frigate:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    networks:
      - appnet
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.frigate.rule=Host(`frigate-ui.example.com`)"
      - "traefik.http.routers.frigate.entrypoints=websecure"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.routers.frigate.tls.certresolver=cloudflare"
      - "traefik.http.services.frigate.loadbalancer.server.port=8971"

  dockwake:
    image: ghcr.io/erikibolya/dockwake:latest
    container_name: dockwake
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DOCKWAKE_PORT: "8080"
      DOCKWAKE_TARGET_CONTAINER: "frigate"
      DOCKWAKE_APP_NAME: "Frigate"
      DOCKWAKE_APP_URL: "https://frigate-ui.example.com/"
      DOCKWAKE_APP_ICON_URL: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/frigate.png"
      DOCKWAKE_TARGET_API_URL: "http://frigate:5000/api/version"
      DOCKWAKE_TARGET_UI_URL: "https://frigate-ui.example.com/"
      DOCKWAKE_LAUNCHER_ORIGIN: "https://wake.example.com"
      DOCKWAKE_LANGUAGE: "cs"
      DOCKWAKE_STOP_BUTTON_POSITION: "top-right"
      DOCKWAKE_IDLE_STOP_SECONDS: "60"
      DOCKWAKE_STOP_GRACE_SECONDS: "30"
      DOCKWAKE_START_TIMEOUT_SECONDS: "120"
    networks:
      - appnet
      - traefik_network
      - dockwake_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.dockwake.rule=Host(`wake.example.com`)"
      - "traefik.http.routers.dockwake.entrypoints=websecure"
      - "traefik.http.routers.dockwake.tls=true"
      - "traefik.http.routers.dockwake.tls.certresolver=cloudflare"
      - "traefik.http.routers.dockwake.service=dockwake"
      - "traefik.http.routers.dockwake.middlewares=dockwake-auth@docker"
      # Generate with: openssl passwd -apr1
      # In Compose YAML every "$" in the hash must be written as "$$".
      - "traefik.http.middlewares.dockwake-auth.basicauth.users=admin:$$apr1$$REPLACE$$ME"
      - "traefik.http.services.dockwake.loadbalancer.server.port=8080"

  dockwake-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: dockwake-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "0"
      CONTAINERS: "0"
      POST: "0"
      PING: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockwake_internal

networks:
  appnet:
  dockwake_internal:
    internal: true
  traefik_network:
    external: true
